<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>блоки для вашої реклами</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Приклади вкладених блоків</h1>

      <section>
        <h2>Один блок усередині іншого</h2>
        <div class="block block-blue">
          Зовнішній блок
          <div class="block block-yellow">Внутрішній блок</div>
        </div>
      </section>

      <section>
        <h2>Кілька рівнів вкладення</h2>
        <div class="block block-green">
          Перший рівень
          <div class="block block-orange">
            Другий рівень
            <div class="block block-pink">Третій рівень</div>
          </div>
        </div>
      </section>

      <section>
        <h2>Декілька блоків усередині одного</h2>
        <div class="block block-blue">
          Батьківський блок
          <div class="block-row">
            <div class="block block-yellow">Перший дочірній блок</div>
            <div class="block block-pink">Другий дочірній блок</div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
